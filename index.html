<!DOCTYPE html>
<html lang="vi" data-theme="pastel">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư giãn — Nguyệt San Tiểu Thuyết &amp; Thư Viện Ebook</title>

  <!-- Google Fonts chuẩn Tiếng Việt: Be Vietnam Pro (UI), Lora (Đọc truyện), JetBrains Mono (Nhãn/Mã kiểu GitHub) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
            serif: ['"Lora"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Thư viện tạo file PDF thật (hỗ trợ đầy đủ dấu Tiếng Việt bằng Roboto) & EPUB 3 thật -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    /* =========================================================================
       4 GIAO DIỆN CHỦ ĐẠO XANH – HỒNG PHONG CÁCH GITHUB
       1. pastel    : Sáng Pastel (nhẹ nhàng, trong trẻo, chữ đậm rõ nét)
       2. warm      : Tone Ấm (giấy kem bảo vệ mắt, hồng đất & xanh dịu)
       3. dark-soft : Tối Dịu (xanh than êm dịu, giữ nét thanh thoát xanh-hồng)
       4. dark-neon : Tối Neon (đêm sâu, cyan neon & hồng neon cân bằng độ chói)
       ========================================================================= */

    :root,
    html[data-theme="pastel"] {
      --bg-body: #f4f8ff;
      --bg-gradient:
        radial-gradient(circle at 10% 8%, rgba(153, 210, 255, 0.34), transparent 46%),
        radial-gradient(circle at 90% 10%, rgba(255, 182, 217, 0.34), transparent 46%),
        linear-gradient(180deg, #f3f8ff 0%, #fff5fa 55%, #f2f8ff 100%);
      --bg-header: rgba(255, 255, 255, 0.88);
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-subtle: #edf4ff;
      --bg-subtle-pink: #fff0f7;
      --text-main: #1b2436;
      --text-secondary: #475873;
      --text-muted: #70829e;
      --border-color: #d5e2f5;
      --accent-blue: #3b8ef3;
      --accent-pink: #e869a6;
      --accent-gradient: linear-gradient(135deg, #5eaef9 0%, #f582ba 100%);
      --hero-bg: linear-gradient(135deg, #d8ecff 0%, #f5e8ff 50%, #ffe3f1 100%);
      --cloud-1: rgba(255, 255, 255, 0.92);
      --cloud-2: rgba(255, 224, 240, 0.8);
      --cloud-3: rgba(207, 236, 255, 0.84);
      --shadow-card: 0 8px 24px -12px rgba(62, 114, 189, 0.16);
      --neon-glow: none;
      --heat-0: #e7f0fb;
      --heat-1: #b5dcff;
      --heat-2: #ffc0df;
      --heat-3: #ed7bb3;
      --heat-4: #4d94f5;
    }

    html[data-theme="warm"] {
      --bg-body: #f5ede0;
      --bg-gradient:
        radial-gradient(circle at 12% 8%, rgba(126, 173, 174, 0.18), transparent 46%),
        radial-gradient(circle at 88% 12%, rgba(204, 140, 149, 0.2), transparent 48%),
        linear-gradient(180deg, #f8f1e5 0%, #f1e6d5 100%);
      --bg-header: rgba(251, 245, 235, 0.93);
      --bg-card: rgba(253, 249, 241, 0.96);
      --bg-subtle: #ece2d1;
      --bg-subtle-pink: #f4e2e3;
      --text-main: #352d27;
      --text-secondary: #5a4e45;
      --text-muted: #827367;
      --border-color: #dccfb9;
      --accent-blue: #497b80;
      --accent-pink: #b86674;
      --accent-gradient: linear-gradient(135deg, #598d92 0%, #c27381 100%);
      --hero-bg: linear-gradient(135deg, #e7ded0 0%, #f1e2dd 52%, #e1e8e5 100%);
      --cloud-1: rgba(255, 250, 242, 0.84);
      --cloud-2: rgba(242, 220, 222, 0.68);
      --cloud-3: rgba(215, 231, 229, 0.68);
      --shadow-card: 0 8px 22px -12px rgba(84, 63, 43, 0.14);
      --neon-glow: none;
      --heat-0: #e7dccd;
      --heat-1: #b4cfcd;
      --heat-2: #e3bcc2;
      --heat-3: #c17684;
      --heat-4: #4c7f84;
    }

    html[data-theme="dark-soft"] {
      --bg-body: #141925;
      --bg-gradient:
        radial-gradient(circle at 12% 10%, rgba(112, 162, 220, 0.14), transparent 46%),
        radial-gradient(circle at 88% 12%, rgba(216, 134, 174, 0.14), transparent 46%),
        linear-gradient(180deg, #131823 0%, #191f2e 55%, #141925 100%);
      --bg-header: rgba(22, 28, 42, 0.9);
      --bg-card: rgba(29, 36, 53, 0.92);
      --bg-subtle: #232c42;
      --bg-subtle-pink: #35273d;
      --text-main: #e6ecf7;
      --text-secondary: #b4c0d8;
      --text-muted: #8292b2;
      --border-color: #313d59;
      --accent-blue: #83b6ec;
      --accent-pink: #de8fb5;
      --accent-gradient: linear-gradient(135deg, #73a6e0 0%, #d781ac 100%);
      --hero-bg: linear-gradient(135deg, #1c273e 0%, #2a243e 52%, #35253a 100%);
      --cloud-1: rgba(154, 194, 240, 0.19);
      --cloud-2: rgba(226, 152, 192, 0.19);
      --cloud-3: rgba(214, 228, 250, 0.13);
      --shadow-card: 0 12px 30px -14px rgba(4, 8, 18, 0.62);
      --neon-glow: none;
      --heat-0: #222b40;
      --heat-1: #3b5b82;
      --heat-2: #774b6b;
      --heat-3: #bd7196;
      --heat-4: #79ace3;
    }

    html[data-theme="dark-neon"] {
      --bg-body: #080b13;
      --bg-gradient:
        radial-gradient(circle at 10% 8%, rgba(42, 218, 250, 0.11), transparent 42%),
        radial-gradient(circle at 90% 10%, rgba(255, 77, 206, 0.11), transparent 44%),
        linear-gradient(180deg, #070a11 0%, #0c1020 55%, #080b13 100%);
      --bg-header: rgba(11, 15, 26, 0.91);
      --bg-card: rgba(15, 21, 36, 0.93);
      --bg-subtle: #131d32;
      --bg-subtle-pink: #291530;
      --text-main: #edf4ff;
      --text-secondary: #b6c8e8;
      --text-muted: #7f95be;
      --border-color: rgba(66, 206, 242, 0.24);
      --accent-blue: #3ce0ff;
      --accent-pink: #ff62d4;
      --accent-gradient: linear-gradient(135deg, #24cde8 0%, #eb4ec4 100%);
      --hero-bg: linear-gradient(135deg, #0b1b2d 0%, #19122e 50%, #2a102b 100%);
      --cloud-1: rgba(60, 224, 255, 0.12);
      --cloud-2: rgba(255, 98, 212, 0.12);
      --cloud-3: rgba(176, 232, 255, 0.08);
      --shadow-card: 0 0 0 1px rgba(60, 224, 255, 0.1), 0 14px 32px -14px rgba(0, 0, 0, 0.75);
      --neon-glow: 0 0 14px rgba(60, 224, 255, 0.2), 0 0 20px rgba(255, 98, 212, 0.14);
      --heat-0: #131c30;
      --heat-1: #165970;
      --heat-2: #6b2266;
      --heat-3: #d147bc;
      --heat-4: #2ccce8;
    }

    body {
      background-color: var(--bg-body);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      transition: background-color 0.35s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    .th-header {
      background-color: var(--bg-header);
      border-color: var(--border-color);
      backdrop-filter: blur(14px);
    }
    .th-card {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(10px);
    }
    .th-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-color);
    }
    .th-subtle-pink {
      background-color: var(--bg-subtle-pink);
      border-color: var(--border-color);
    }
    .th-border { border-color: var(--border-color); }
    .th-text-sec { color: var(--text-secondary); }
    .th-text-muted { color: var(--text-muted); }
    .th-blue { color: var(--accent-blue); }
    .th-pink { color: var(--accent-pink); }

    .th-btn-primary {
      background-image: var(--accent-gradient);
      color: #ffffff;
      box-shadow: var(--neon-glow);
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    .th-btn-primary:hover {
      opacity: 0.93;
      transform: translateY(-1px);
    }

    html[data-theme="dark-neon"] .neon-ring {
      box-shadow: 0 0 12px rgba(60, 224, 255, 0.14), inset 0 0 10px rgba(255, 98, 212, 0.06);
    }
    html[data-theme="dark-neon"] .neon-text {
      text-shadow: 0 0 10px rgba(60, 224, 255, 0.28), 0 0 18px rgba(255, 98, 212, 0.18);
    }

    /* =========================================================================
       BẦU TRỜI NHỮNG ÁNG MÂY TRÔI MỜ MỜ (LẶP MƯỢT NHƯ ẢNH GIF THƠ MỘNG)
       ========================================================================= */
    .cloud-hero-bg {
      background: var(--hero-bg);
      position: relative;
      overflow: hidden;
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      width: 200%;
      height: 100%;
      display: flex;
      pointer-events: none;
      will-change: transform;
    }

    .cloud-layer svg {
      width: 50%;
      height: 100%;
      flex-shrink: 0;
    }

    .cloud-drift-slow {
      animation: cloudDrift 58s linear infinite;
      filter: blur(9px);
      opacity: 0.92;
    }
    .cloud-drift-mid {
      animation: cloudDrift 38s linear infinite;
      filter: blur(13px);
      opacity: 0.82;
    }
    .cloud-drift-fast {
      animation: cloudDriftReverse 48s linear infinite;
      filter: blur(18px);
      opacity: 0.72;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    @keyframes cloudDriftReverse {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }

    /* Đèn cây thông Noel nhấp nháy */
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.75); }
    }
    .xmas-light {
      animation: twinkle 1.8s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .xmas-d1 { animation-delay: 0.45s; }
    .xmas-d2 { animation-delay: 0.9s; }
    .xmas-d3 { animation-delay: 1.35s; }

    /* Sóng nhạc mini */
    @keyframes eqBar {
      0%, 100% { height: 22%; }
      50% { height: 100%; }
    }
    .eq-playing .eq-1 { animation: eqBar 0.7s ease-in-out infinite; }
    .eq-playing .eq-2 { animation: eqBar 0.55s ease-in-out infinite 0.15s; }
    .eq-playing .eq-3 { animation: eqBar 0.85s ease-in-out infinite 0.3s; }

    /* Thanh tab ngang kiểu GitHub */
    .gh-tab {
      position: relative;
      color: var(--text-secondary);
      transition: color 0.18s ease;
    }
    .gh-tab:hover { color: var(--text-main); }
    .gh-tab.active {
      color: var(--text-main);
      font-weight: 600;
    }
    .gh-tab.active::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: -1px;
      height: 2.5px;
      border-radius: 999px;
      background-image: var(--accent-gradient);
    }

    /* Kiểu chữ trình đọc truyện */
    .novel-prose p {
      margin-bottom: 1.35em;
      text-align: justify;
    }
    .novel-prose p:first-of-type::first-letter {
      font-family: "Lora", Georgia, serif;
      float: left;
      font-size: 3.35em;
      line-height: 0.84;
      padding-top: 0.06em;
      padding-right: 0.14em;
      font-weight: 700;
      color: var(--accent-pink);
    }
    .novel-prose h2 {
      font-size: 1.35em;
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 0.9rem;
      color: var(--accent-blue);
    }
    .novel-prose blockquote {
      border-left: 3px solid var(--accent-pink);
      padding-left: 1.1rem;
      margin: 1.5rem 0;
      font-style: italic;
      color: var(--text-secondary);
    }

    .fade-view { animation: fadeSlide 0.28s ease-out forwards; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-pink-300/30">

  <!-- CANVAS HOẠT ẢNH 4 MÙA & GIÁNG SINH TỰ ĐỘNG -->
  <canvas id="season-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-40" aria-hidden="true"></canvas>

  <!-- Thanh tiến độ đọc toàn màn hình -->
  <div id="read-progress-wrap" class="fixed top-0 left-0 w-full h-1 z-[75] hidden">
    <div id="read-progress-bar" class="h-full" style="width: 0%; background-image: var(--accent-gradient);"></div>
  </div>

  <!-- Thông báo nổi Toast (không dùng alert/confirm) -->
  <div
    id="toast-el"
    role="status"
    aria-live="polite"
    class="fixed top-20 right-4 sm:right-6 z-[95] max-w-sm px-4 py-3 rounded-2xl border th-card text-xs sm:text-sm font-medium opacity-0 pointer-events-none -translate-y-2 transition-all duration-300 flex items-center gap-2.5 shadow-lg"
  >
    <span id="toast-dot" class="w-2.5 h-2.5 rounded-full shrink-0" style="background-image: var(--accent-gradient);"></span>
    <span id="toast-text">Thông báo</span>
  </div>

  <!-- =========================================================================
       HEADER PHONG CÁCH GITHUB
       ========================================================================= -->
  <header class="sticky top-0 z-50 border-b th-header">
    <div class="max-w-7xl mx-auto px-3 sm:px-6">
      <!-- Hàng 1: Logo + Tìm kiếm + 4 Giao diện + Chọn Mùa + Nhạc -->
      <div class="py-2.5 flex flex-wrap items-center justify-between gap-2.5">
        <div class="flex items-center gap-2.5">
          <button type="button" onclick="app.switchTab('stories')" class="flex items-center gap-2.5 focus:outline-none">
            <div class="w-9 h-9 rounded-xl th-btn-primary flex items-center justify-center shadow-sm shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.5 19h11a4 4 0 00.7-7.94A5.5 5.5 0 007.4 9.5a4.5 4.5 0 00-.9 9.5z" />
              </svg>
            </div>
            <div class="text-left leading-tight">
              <div class="flex items-center gap-1.5">
                <span class="font-serif font-bold text-lg sm:text-xl tracking-tight neon-text">Thư giãn</span>
                <span id="fb-live-badge" class="hidden sm:inline-block font-mono text-[10px] px-2 py-0.5 rounded-full border th-border th-subtle th-blue font-medium">
                  Firebase Live
                </span>
              </div>
              <p class="text-[10px] sm:text-[11px] th-text-muted hidden sm:block">Nguyệt san tiểu thuyết &amp; Thư viện Ebook</p>
            </div>
          </button>
        </div>

        <!-- Thanh tìm kiếm từ khóa kiểu GitHub (nhấn phím / để gõ nhanh) -->
        <div class="order-3 md:order-2 w-full md:w-auto md:flex-1 md:max-w-md">
          <div class="relative flex items-center">
            <svg class="w-4 h-4 absolute left-3 th-text-muted pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              id="global-search-input"
              type="text"
              oninput="app.handleSearch(this.value)"
              placeholder="Tìm truyện, bộ kỳ, #hashtag... (nhấn /)"
              class="w-full pl-9 pr-12 py-1.5 sm:py-2 rounded-xl border th-border th-subtle text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-pink-300/40"
            />
            <button
              id="clear-search-btn"
              type="button"
              onclick="app.clearSearch()"
              class="hidden absolute right-2.5 px-1.5 py-0.5 rounded text-[11px] th-text-muted hover:opacity-75"
              title="Xóa từ khóa"
            >✕</button>
            <kbd id="search-kbd-hint" class="hidden sm:inline-block absolute right-2.5 px-1.5 py-0.5 rounded border th-border font-mono text-[10px] th-text-muted pointer-events-none">/</kbd>
          </div>
        </div>

        <!-- Cụm công cụ: 4 Giao diện + Chọn Mùa + Nhạc -->
        <div class="order-2 md:order-3 flex items-center gap-1.5 sm:gap-2">
          <!-- 4 Giao diện màu Xanh - Hồng -->
          <div class="inline-flex items-center rounded-xl border th-border th-subtle p-0.5 gap-0.5" role="group" aria-label="Chọn 4 giao diện">
            <button type="button" data-theme-btn="pastel" onclick="app.setTheme('pastel')" title="Sáng Pastel" class="px-2 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1">
              <span>🌸</span><span class="hidden xl:inline text-[11px]">Pastel</span>
            </button>
            <button type="button" data-theme-btn="warm" onclick="app.setTheme('warm')" title="Tone Ấm đọc sách" class="px-2 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1">
              <span>☕</span><span class="hidden xl:inline text-[11px]">Ấm</span>
            </button>
            <button type="button" data-theme-btn="dark-soft" onclick="app.setTheme('dark-soft')" title="Tối Dịu" class="px-2 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1">
              <span>🌙</span><span class="hidden xl:inline text-[11px]">Tối dịu</span>
            </button>
            <button type="button" data-theme-btn="dark-neon" onclick="app.setTheme('dark-neon')" title="Tối Neon" class="px-2 py-1.5 rounded-lg text-xs transition-all flex items-center gap-1">
              <span>⚡</span><span class="hidden xl:inline text-[11px]">Neon</span>
            </button>
          </div>

          <!-- Bộ chọn kiểm thử 4 mùa & Giáng Sinh -->
          <div class="relative">
            <select
              id="season-selector"
              onchange="app.setSeasonOverride(this.value)"
              title="Tự động theo ngày thực hoặc xem thử từng mùa"
              class="pl-2 pr-6 py-1.5 rounded-xl border th-border th-subtle text-[11px] sm:text-xs font-medium cursor-pointer focus:outline-none appearance-none"
            >
              <option value="auto">🗓️ Tự động</option>
              <option value="spring">🌸 Xuân (1/1–15/3)</option>
              <option value="summer">☀️ Hạ (16/3–30/6)</option>
              <option value="autumn">🍁 Thu (1/7–30/9)</option>
              <option value="winter">❄️ Đông (1/10–31/12)</option>
              <option value="christmas">🎄 Noel (23–25/12)</option>
            </select>
            <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-[9px] th-text-muted">▼</span>
          </div>

          <!-- Nút bật/thu gọn trình nhạc -->
          <button
            type="button"
            onclick="app.toggleMusicDrawer()"
            title="Mở / Thu gọn trình phát nhạc"
            class="p-2 rounded-xl border th-border th-subtle hover:opacity-80 flex items-center gap-1"
          >
            <span class="text-xs">🎵</span>
            <span id="header-eq" class="hidden sm:flex items-end gap-0.5 h-3 w-3">
              <span class="eq-1 w-0.5 h-1 rounded-full" style="background:var(--accent-blue);"></span>
              <span class="eq-2 w-0.5 h-2 rounded-full" style="background:var(--accent-pink);"></span>
              <span class="eq-3 w-0.5 h-1.5 rounded-full" style="background:var(--accent-blue);"></span>
            </span>
          </button>
        </div>
      </div>

      <!-- Hàng 2: 5 Tab chính phong cách GitHub -->
      <nav class="flex items-center gap-1 sm:gap-2 overflow-x-auto -mb-px text-xs sm:text-sm" aria-label="Điều hướng chính">
        <button type="button" id="tab-stories" onclick="app.switchTab('stories')" class="gh-tab active px-3 py-2.5 flex items-center gap-1.5 whitespace-nowrap">
          <span>📖</span>
          <span>Tủ truyện</span>
          <span id="count-stories" class="font-mono px-1.5 py-0.5 rounded-full text-[10px] th-subtle th-text-muted">0</span>
        </button>

        <button type="button" id="tab-ebooks" onclick="app.switchTab('ebooks')" class="gh-tab px-3 py-2.5 flex items-center gap-1.5 whitespace-nowrap">

    // =========================================================================

    function loadLS(key, fallback) {
      try {

        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }
    function saveLS(key, val) {

    function formatDateKey(d = new Date()) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function formatDateTimeVN(ts) {
      if (!ts) return "";
      const d = typeof ts === "number" ? new Date(ts) : (ts.toDate ? ts.toDate() : new Date(ts));
      if (Number.isNaN(d.getTime())) return "";
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mi = String(d.getMinutes()).padStart(2, "0");
      return `${dd}/${mm}/${d.getFullYear()} • ${hh}:${mi}`;
    }

    function formatDateShortVN(ts) {
      if (!ts) return "";
      const d = typeof ts === "number" ? new Date(ts) : (ts.toDate ? ts.toDate() : new Date(ts));
      if (Number.isNaN(d.getTime())) return "";
      return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
    }

          d.setDate(today.getDate() - Math.floor(Math.random() * 110));
          const k = formatDateKey(d);

    }

    // =========================================================================

    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    let toastTimer = null;
    function showToast(msg, isError = false) {
      const el = document.getElementById("toast-el");
      const dot = document.getElementById("toast-dot");
      document.getElementById("toast-text").textContent = msg;
      dot.style.background = isError ? "#f43f5e" : "";
      if (!isError) dot.style.backgroundImage = "var(--accent-gradient)";
      el.classList.remove("opacity-0", "pointer-events-none", "-translate-y-2");
      el.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add("opacity-0", "pointer-events-none", "-translate-y-2");
        el.classList.remove("opacity-100", "translate-y-0");
      }, isError ? 5200 : 3400);
    }

    function handleFirestoreWriteError(err, actionLabel) {
      console.error("Firestore write error:", err);
      const code = err && err.code ? err.code : "";
      if (code === "permission-denied" || (err && String(err.message).includes("permission"))) {
        state.showRulesHelper = true;
        showToast(
          `Bị từ chối quyền (permission-denied) khi ${actionLabel}. Hãy kiểm tra lại tab Rules trên Cloud Firestore với đúng email ${OWNER_EMAIL}!`,
          true
        );
        if (state.tab === "owner") renderApp();
      } else {
        showToast(`Lỗi khi ${actionLabel}: ${err.message || "Vui lòng thử lại."}`, true);
      }
    }

    function copyTextSafe(text, successMsg) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(successMsg);
      } catch {
        showToast("Không thể tự động sao chép, bạn hãy bôi đen copy thủ công nhé.", true);
      }
    }

    function countWords(text) {

    function recordReadingActivity(points = 1) {

      const key = formatDateKey();
      state.profile.activity[key] = (state.profile.activity[key] || 0) + points;

    function parseStoryBlocks(content) {
      const lines = (content || "").split(/\r?\n/);
      const blocks = [];
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith("## ")) {
          blocks.push({ type: "h2", text: line.replace(/^##\s+/, "").trim() });
        } else if (line.startsWith("> ")) {
          blocks.push({ type: "quote", text: line.replace(/^>\s+/, "").trim() });
        } else {
          blocks.push({ type: "p", text: line });
        }
      }
      return blocks;
    }

    function slugify(str) {
      return (str || "thu-gian")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .replace(/[^a-zA-Z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .toLowerCase();
    }

      } else {
        if (footer) footer.innerHTML = `<span class="th-blue">●</span> Đang đồng bộ Firestore...`;
      }
    }

    function initRealtimeSubscriptions() {
      if (!auth || !db) {
        state.fbStatus = "error";
        updateFirebaseStatusUI();
        return;
      }

      // 1. Theo dõi phiên đăng nhập Firebase Auth (chỉ mở khóa đúng OWNER_EMAIL)
      onAuthStateChanged(auth, async (user) => {
        state.ownerAuthChecked = true;
        if (user && user.email && user.email.toLowerCase() === OWNER_EMAIL.toLowerCase()) {
          state.ownerUser = user;
          state.ownerLoginError = "";
        } else {
          if (user) {
            try { await signOut(auth); } catch {}
            state.ownerLoginError = `Tài khoản ${user.email} không phải email Chủ web (${OWNER_EMAIL}).`;
          }
          state.ownerUser = null;
        }
        document.getElementById("owner-status-dot").classList.toggle("hidden", !isOwnerAuthenticated());
        if (state.tab === "owner" || state.tab === "mailbox") renderApp();
      });

      // 2. Real-time Collection `stories`
      try {
        const qStories = query(collection(db, "stories"), orderBy("createdAt", "desc"));
        onSnapshot(
          qStories,
          (snap) => {
            const list = [];
            snap.forEach((d) => list.push({ id: d.id, isSample: false, ...d.data() }));
            state.firestoreStories = list;
            state.storiesLoaded = true;
            state.fbStatus = "connected";
            updateFirebaseStatusUI();
            updateNavCounts();
            if (["stories", "ebooks", "owner", "profile"].includes(state.tab)) renderApp();
          },
          (err) => {
            console.warn("onSnapshot stories error:", err);
            state.storiesLoaded = true;
            state.fbStatus = "error";
            state.fbLastError = err.code || err.message;
            updateFirebaseStatusUI();
            renderApp();
          }
        );
      } catch (err) {
        console.error(err);
      }

      // 3. Real-time Collection `mailbox`
      try {
        const qMail = query(collection(db, "mailbox"), orderBy("createdAt", "desc"));
        onSnapshot(
          qMail,
          (snap) => {
            const list = [];
            snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
            state.mailbox = list;
            state.fbStatus = "connected";
            updateFirebaseStatusUI();
            updateNavCounts();
            if (state.tab === "mailbox" || state.tab === "owner") renderApp();
          },
          (err) => {
            console.warn("onSnapshot mailbox error:", err);
          }
        );
      } catch (err) {
        console.error(err);
      }

      // 4. Real-time Document `settings/siteConfig`
      try {
        onSnapshot(
          doc(db, "settings", "siteConfig"),
          (snap) => {
            if (snap.exists()) {
              state.siteConfig = { ...DEFAULT_SITE_CONFIG, ...snap.data() };
            } else {
              state.siteConfig = { ...DEFAULT_SITE_CONFIG };
            }
            applySiteMusicConfig(false);
            if (state.tab === "stories" || state.tab === "owner") renderApp();
          },
          (err) => {
            console.warn("onSnapshot settings error:", err);
          }
        );
      } catch (err) {
        console.error(err);
      }
    }

    // =========================================================================
    // TỰ ĐỘNG HÓA 4 MÙA & GIÁNG SINH THEO LỊCH THỰC (CANVAS)
    // =========================================================================
    function detectRealSeason(date = new Date()) {
      const m = date.getMonth() + 1;
      const d = date.getDate();
      if (m === 12 && d >= 23 && d <= 25) return "christmas";
      if (m === 1 || m === 2 || (m === 3 && d <= 15)) return "spring";
      if ((m === 3 && d >= 16) || (m >= 4 && m <= 6)) return "summer";
      if (m >= 7 && m <= 9) return "autumn";
      return "winter";
    }

    function getActiveSeason() {
      return state.seasonOverride === "auto" ? detectRealSeason() : state.seasonOverride;
    }

      spring: { icon: "🌸", name: "Mùa Xuân", badge: "Mùa Xuân • Hoa anh đào rơi", range: "1/1 – 15/3" },

    function refreshSeasonalPalette() {
      const active = getActiveSeason();
      if (active === "autumn" || active === "spring") {
        const pal = active === "autumn" ? getAutumnColors() : getSpringColors();
        particles.forEach((p, idx) => { p.color = pal[idx % pal.length]; });
      }
    }

    function initSeasonParticles() {
      particles = [];
      const active = getActiveSeason();
      const w = seasonCanvas.width || window.innerWidth;
      const h = seasonCanvas.height || window.innerHeight;
      const mobile = w < 640;

      if (active === "spring") {
        const count = mobile ? 20 : 36;
        const pal = getSpringColors();
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: 6 + Math.random() * 6.5,
            vx: -0.3 + Math.random() * 0.8,
            vy: 0.55 + Math.random() * 0.85,
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.032,
            sway: Math.random() * Math.PI * 2,
            opacity: 0.45 + Math.random() * 0.42,
            color: pal[i % pal.length]
          });
        }
      } else if (active === "summer") {
        const count = mobile ? 20 : 34;
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h * 0.72,
            r: 3.5 + Math.random() * 14,
            vx: -0.22 + Math.random() * 0.44,
            vy: -0.15 + Math.random() * 0.3,
            phase: Math.random() * Math.PI * 2,
            isAqua: i % 3 === 0
          });
        }
      } else if (active === "autumn") {
        const count = mobile ? 18 : 32;
        const pal = getAutumnColors();
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: 8 + Math.random() * 7.5,
            vx: 0.25 + Math.random() * 0.75,
            vy: 0.65 + Math.random() * 0.95,
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.035,
            sway: Math.random() * Math.PI * 2,
            opacity: state.theme === "dark-neon" ? 0.36 + Math.random() * 0.28 : 0.48 + Math.random() * 0.36,
            color: pal[i % pal.length]
          });
        }
      } else {
        // Đông & Giáng Sinh: tuyết rơi nhiều tầng chiều sâu
        const count = mobile ? 34 : 60;
        for (let i = 0; i < count; i++) {
          const depth = 0.5 + Math.random() * 1.1;
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: (1.5 + Math.random() * 2.4) * depth,
            vx: (Math.random() - 0.5) * 0.32 * depth,
            vy: (0.45 + Math.random() * 0.85) * depth,
            sway: Math.random() * Math.PI * 2,
            opacity: Math.min(0.9, 0.32 + Math.random() * 0.45 * depth),
            crystal: i % 7 === 0
          });
        }
      }
    }

    function drawSakura(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.scale(1, 0.68 + 0.32 * Math.sin(p.angle * 2));
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(0, -p.size * 0.5);
      ctx.bezierCurveTo(p.size * 0.6, -p.size * 0.9, p.size * 0.9, p.size * 0.2, 0, p.size * 0.65);
      ctx.bezierCurveTo(-p.size * 0.9, p.size * 0.2, -p.size * 0.6, -p.size * 0.9, 0, -p.size * 0.5);
      ctx.fill();
      ctx.restore();
    }

    function drawAutumnLeaf(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.scale(1, 0.74 + 0.26 * Math.cos(p.angle * 1.8));
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(0, -p.size * 0.88);
      ctx.quadraticCurveTo(p.size * 0.76, -p.size * 0.22, 0, p.size * 0.88);
      ctx.quadraticCurveTo(-p.size * 0.76, -p.size * 0.22, 0, -p.size * 0.88);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.32)";
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, -p.size * 0.65);
      ctx.lineTo(0, p.size * 0.72);
      ctx.stroke();
      ctx.restore();
    }

    function drawSummerBeach(ctx, w, h, t) {
      const sunX = w * 0.88;
      const sunY = h * 0.05;
      const isDark = state.theme === "dark-soft" || state.theme === "dark-neon";
      const base = isDark ? 0.1 : 0.22;

      // Vầng nắng chói chang góc trên phải
      const glow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, Math.max(w, h) * 0.54);
      glow.addColorStop(0, `rgba(255, 232, 145, ${base * 1.55})`);
      glow.addColorStop(0.32, `rgba(255, 198, 122, ${base * 0.72})`);
      glow.addColorStop(0.68, `rgba(116, 214, 255, ${base * 0.22})`);
      glow.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h * 0.72);

      // Các tia nắng xiên lung linh
      ctx.save();
      ctx.translate(sunX, sunY);
      for (let i = 0; i < 6; i++) {
        const angle = 2.1 + i * 0.19 + Math.sin(t * 0.008 + i) * 0.03;
        ctx.save();
        ctx.rotate(angle);
        const ray = ctx.createLinearGradient(0, 0, Math.max(w, h) * 0.68, 0);
        ray.addColorStop(0, `rgba(255, 236, 168, ${base * 0.82})`);
        ray.addColorStop(1, "rgba(255, 236, 168, 0)");
        ctx.fillStyle = ray;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(Math.max(w, h) * 0.68, -58);
        ctx.lineTo(Math.max(w, h) * 0.68, 58);
        ctx.lineTo(0, 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      // Ánh sóng bờ biển dịu lấp lánh ở mép dưới
      const waveY = h - 18;
      ctx.save();
      const waveGrad = ctx.createLinearGradient(0, h - 55, 0, h);
      waveGrad.addColorStop(0, "rgba(110, 212, 255, 0)");
      waveGrad.addColorStop(1, isDark ? "rgba(60, 210, 255, 0.1)" : "rgba(104, 196, 255, 0.18)");
      ctx.fillStyle = waveGrad;
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 28) {
        const dy = Math.sin(x * 0.012 + t * 0.03) * 8 + Math.cos(x * 0.02 - t * 0.02) * 4;
        ctx.lineTo(x, waveY + dy);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Hạt sáng nắng biển lơ lửng
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -30) p.x = w + 30;
        if (p.x > w + 30) p.x = -30;
        if (p.y < -20) p.y = h * 0.68;
        if (p.y > h * 0.74) p.y = -15;

        const pulse = 0.24 + 0.34 * Math.sin(t * 0.026 + p.phase);
        const alpha = isDark ? pulse * 0.3 : pulse * 0.44;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.isAqua ? `rgba(122, 224, 255, ${alpha})` : `rgba(255, 224, 142, ${alpha})`;
        ctx.fill();
      });
    }

    function drawSnowflake(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = p.opacity;
      const col = state.theme === "pastel" ? "#98cafb" : state.theme === "warm" ? "#c9bfb0" : "#e8f6ff";
      ctx.fillStyle = col;
      ctx.strokeStyle = col;
      if (p.crystal) {
        ctx.lineWidth = 1;
        const r = p.r * 1.45;
        for (let k = 0; k < 3; k++) {
          ctx.rotate(Math.PI / 3);
          ctx.beginPath();
          ctx.moveTo(-r, 0);
          ctx.lineTo(r, 0);
          ctx.stroke();
        }
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function animateSeasons() {
      animTick++;
      const w = seasonCanvas.width;
      const h = seasonCanvas.height;
      sCtx.clearRect(0, 0, w, h);
      const active = getActiveSeason();

      if (active === "summer") {
        drawSummerBeach(sCtx, w, h, animTick);
      } else {
        particles.forEach((p) => {
          p.sway += 0.018;
          p.x += p.vx + Math.sin(p.sway) * 0.4;
          p.y += p.vy;
          if (p.angle !== undefined) p.angle += p.spin;
          if (p.y > h + 22) { p.y = -20; p.x = Math.random() * w; }
          if (p.x > w + 25) p.x = -20;
          if (p.x < -25) p.x = w + 20;

          if (active === "spring") drawSakura(sCtx, p);
          else if (active === "autumn") drawAutumnLeaf(sCtx, p);
          else drawSnowflake(sCtx, p);
        });
      }
      requestAnimationFrame(animateSeasons);
    }

    function getPlaylist() {
      const list = [...BUILTIN_TRACKS];
      const url = (state.siteConfig.customMp3Url || "").trim();
      if (url) {
        list.unshift({ id: "custom-mp3", title: "Nhạc riêng Chủ web", subtitle: "Tệp MP3 tùy chỉnh", type: "mp3", url });
      }
      return list;
    }

    function getCurrentTrack() {
      const list = getPlaylist();
      return list.find((t) => t.id === audioEngine.currentTrackId) || list[0];
    }

    function ensureAudioCtx() {
      if (!audioEngine.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioEngine.ctx = new AC();
        audioEngine.gain = audioEngine.ctx.createGain();
        audioEngine.gain.gain.value = audioEngine.volume * 0.26;
        audioEngine.gain.connect(audioEngine.ctx.destination);
      }
      if (audioEngine.ctx.state === "suspended") audioEngine.ctx.resume().catch(() => {});
    }

    function playSynthChord(freqs, wave, dur) {
      if (!audioEngine.ctx || !freqs) return;
      const now = audioEngine.ctx.currentTime;
      freqs.forEach((f) => {
        if (!f) return;
        const osc = audioEngine.ctx.createOscillator();
        const env = audioEngine.ctx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(f, now);
        env.gain.setValueAtTime(0.0001, now);
        env.gain.exponentialRampToValueAtTime(0.26 / freqs.length, now + 0.045);
        env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(env);
        env.connect(audioEngine.gain);
        osc.start(now);
        osc.stop(now + dur + 0.05);
      });
    }

    function stopMusic() {
      clearInterval(audioEngine.timer);
      audioEngine.timer = null;
      if (audioEngine.htmlAudio) {
        audioEngine.htmlAudio.pause();
        audioEngine.htmlAudio = null;
      }
      audioEngine.isPlaying = false;
      updateMusicUI();
    }

    function startMusic() {
      stopMusic();
      const track = getCurrentTrack();
      if (!track) return;
      document.getElementById("music-autoplay-hint").classList.add("hidden");

      if (track.type === "mp3" && track.url) {
        try {
          const audio = new Audio(track.url);
          audio.loop = true;
          audio.volume = audioEngine.volume;
          audio.play().then(() => {
            audioEngine.htmlAudio = audio;
            audioEngine.isPlaying = true;
            updateMusicUI();
          }).catch(() => {
            document.getElementById("music-autoplay-hint").classList.remove("hidden");
            showToast("Không phát được link MP3 hoặc trình duyệt chặn tự phát. Nhấn Phát lại nhé!", true);
          });
        } catch {
          showToast("Link file MP3 không hợp lệ.", true);
        }
        return;
      }

      ensureAudioCtx();
      const mel = SYNTH_MELODIES[track.id] || SYNTH_MELODIES.spring;
      audioEngine.step = 0;
      audioEngine.isPlaying = true;
      updateMusicUI();

      const tick = () => {
        if (!audioEngine.isPlaying) return;
        playSynthChord(mel.notes[audioEngine.step % mel.notes.length], mel.wave, (mel.tempoMs / 1000) * 1.45);
        audioEngine.step++;
      };
      tick();
      audioEngine.timer = setInterval(tick, mel.tempoMs);
    }

    function updateMusicUI() {
      const track = getCurrentTrack();
      if (!track) return;
      document.getElementById("music-track-title").textContent = track.title;
      document.getElementById("music-track-meta").textContent = track.subtitle;
      document.getElementById("music-play-icon").textContent = audioEngine.isPlaying ? "⏸" : "▶";
      document.getElementById("music-play-label").textContent = audioEngine.isPlaying ? "Dừng" : "Phát";
      document.getElementById("music-volume-slider").value = audioEngine.volume;
      document.getElementById("music-mini-label").textContent = audioEngine.isPlaying ? `Đang phát: ${track.title}` : "Nhạc thư giãn";
      document.getElementById("header-eq").classList.toggle("eq-playing", audioEngine.isPlaying);
    }

    function applySiteMusicConfig(fromUserClick = false) {
      const cfg = state.siteConfig;
      const dock = document.getElementById("music-player-dock");
      const fab = document.getElementById("music-mini-fab");

      if (!cfg.musicEnabled) {
        stopMusic();
        if (dock) dock.classList.add("hidden");
        if (fab) fab.classList.add("hidden");
        return;
      } else {
        if (state.musicDrawerOpen) {
          dock.classList.remove("hidden");
          fab.classList.add("hidden");
        } else {
          dock.classList.add("hidden");
          fab.classList.remove("hidden");
          fab.classList.add("inline-flex");
        }
      }

      audioEngine.volume = typeof cfg.volume === "number" ? cfg.volume : 0.45;
      const activeSeason = getActiveSeason();
      const hasCustom = Boolean((cfg.customMp3Url || "").trim());

      if (activeSeason === "christmas" && cfg.autoPlayChristmas) {
        audioEngine.currentTrackId = hasCustom && cfg.selectedTrack === "custom-mp3" ? "custom-mp3" : "christmas";
      } else if (hasCustom && cfg.selectedTrack === "custom-mp3") {
        audioEngine.currentTrackId = "custom-mp3";
      } else {
        audioEngine.currentTrackId = cfg.selectedTrack || "spring";
      }

      updateMusicUI();

      const shouldAuto = (activeSeason === "christmas" && cfg.autoPlayChristmas) || cfg.autoPlayAllYear;
      if (shouldAuto && !audioEngine.isPlaying) {
        if (fromUserClick) {
          startMusic();
        } else {
          const hint = document.getElementById("music-autoplay-hint");
          const txt = document.getElementById("music-autoplay-hint-text");
          if (hint && txt) {
            txt.textContent = activeSeason === "christmas" ? "🎄 Nhạc Giáng Sinh đã sẵn sàng" : "🎵 Nhạc nền Thư giãn đã sẵn sàng";
            hint.classList.remove("hidden");
          }
        }
      }
    }

        zip.file(
          "OEBPS/style.css",
          `body { font-family: Georgia, serif; line-height: 1.85; color: #2b2623; margin: 1.2em; }
h1 { color: #3b6f8c; margin-bottom: 0.25em; font-size: 1.65em; }
h2 { color: #b86674; margin-top: 1.5em; font-size: 1.25em; }
.meta { color: #756b63; font-style: italic; margin-bottom: 1.4em; font-size: 0.92em; }
.summary { border: 1px solid #e2d8cc; padding: 0.9em; border-radius: 6px; font-style: italic; margin-bottom: 1.4em; }
blockquote { border-left: 3px solid #b86674; padding-left: 1em; font-style: italic; color: #564c44; margin: 1.2em 0; }
p { text-align: justify; margin-bottom: 0.95em; }
.note { margin-top: 2em; padding-top: 1em; border-top: 1px solid #e2d8cc; font-size: 0.92em; font-style: italic; }`
        );

        // 7. OEBPS/chapter.xhtml
        const bodyHtml = blocks
          .map((b) => {
            if (b.type === "h2") return `<h2>${esc(b.text)}</h2>`;
            if (b.type === "quote") return `<blockquote>“${esc(b.text)}”</blockquote>`;
            return `<p>${esc(b.text)}</p>`;
          })
          .join("\n  ");

        const noteHtml = story.authorNote
          ? `<div class="note"><strong>Lời nhắn của tác giả:</strong><br/>${esc(story.authorNote)}</div>`
          : "";

        zip.file(
          "OEBPS/chapter.xhtml",
          `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="vi">
<head>
  <meta charset="utf-8"/>
  <title>${esc(story.title)}</title>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
  <h1>${esc(story.title)}</h1>
  <p class="meta">${esc(story.issue || "Nguyệt san Thư giãn")}${story.series ? ` • Bộ: ${esc(story.series)}` : ""} • Biên tập: ${esc(ownerName)}</p>
  ${story.summary ? `<div class="summary">${esc(story.summary)}</div>` : ""}
  ${bodyHtml}
  ${noteHtml}
</body>
</html>`
        );

        const blob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${slugify(story.title)}.epub`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);

        state.profile.downloadsCount = (state.profile.downloadsCount || 0) + 1;
        recordReadingActivity(2);
        showToast(`📥 Đã tạo & tải tệp .EPUB chuẩn máy đọc sách: ${story.title}`);
      } catch (err) {
        console.error("EPUB error:", err);
        showToast("Có lỗi khi đóng gói file EPUB: " + err.message, true);
      }
    }

    // --- TAB 4: 👤 CÁ NHÂN (PHONG CÁCH GITHUB PROFILE + BIỂU ĐỒ ĐỌC SÁCH) ---
    function renderProfileTab() {
      const p = state.profile;
      const stories = getVisibleStories();
      const bookmarked = (p.bookmarks || []).map((id) => stories.find((s) => s.id === id)).filter(Boolean);
      const act = p.activity || {};
      const totalPts = Object.values(act).reduce((a, b) => a + b, 0);

      // Biểu đồ đóng góp / hoạt động đọc sách 16 tuần (112 ngày) phối màu Xanh - Hồng
      const cells = [];
      const today = new Date();
      for (let i = 111; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const k = formatDateKey(d);
        const v = act[k] || 0;
        const lv = v === 0 ? 0 : v === 1 ? 1 : v === 2 ? 2 : v <= 4 ? 3 : 4;
        cells.push(`<div class="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-[3px] transition-transform hover:scale-125" style="background-color:var(--heat-${lv});" title="${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}: ${v} hoạt động đọc"></div>`);
      }

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 fade-view">
          <aside class="lg:col-span-4 space-y-4">
            <div class="rounded-3xl border th-card p-6 space-y-4 neon-ring">
              <div class="flex items-center gap-4 lg:flex-col lg:items-start">
                <div class="w-20 h-20 lg:w-28 lg:h-28 rounded-full border-4 th-border overflow-hidden shadow-md shrink-0">
                  ${renderAvatarEl(p, "w-full h-full text-4xl")}
                </div>
                <div class="min-w-0">
                  <h2 class="text-xl sm:text-2xl font-bold truncate">${esc(p.displayName)}</h2>
                  <p class="font-mono text-xs sm:text-sm th-text-muted">@${esc(p.nickname)}</p>
                </div>
              </div>
              <p class="text-xs sm:text-sm th-text-sec leading-relaxed">${esc(p.bio)}</p>

              <!-- Form lưu/chỉnh hồ sơ cá nhân -->
              <form onsubmit="app.saveProfile(event)" class="pt-4 border-t th-border space-y-3 text-xs">
                <p class="font-bold th-blue">✏️ Chỉnh sửa hồ sơ cá nhân</p>
                <div>
                  <label class="block mb-1 th-text-muted">Chọn Emoji đại diện</label>
                  <div class="flex flex-wrap gap-1.5">
                    ${AVATAR_EMOJIS.map(
                      (em) => `<button type="button" onclick="app.pickAvatarEmoji('${em}')" class="w-8 h-8 rounded-full border th-border th-subtle flex items-center justify-center text-sm transition-transform ${!p.avatarUrl && p.avatarEmoji === em ? "ring-2 ring-pink-400 scale-110" : "opacity-80 hover:opacity-100"}">${em}</button>`
                    ).join("")}
                  </div>
                </div>
                <div>
                  <label class="block mb-1 th-text-muted">Hoặc dán link ảnh Avatar (URL)</label>
                  <input id="pf-url" type="url" value="${esc(p.avatarUrl || "")}" placeholder="https://..." class="w-full px-3 py-2 rounded-xl border th-border th-subtle" />
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block mb-1 th-text-muted">Tên hiển thị</label>
                    <input id="pf-name" type="text" required value="${esc(p.displayName)}" class="w-full px-3 py-2 rounded-xl border th-border th-subtle" />
                  </div>
                  <div>
                    <label class="block mb-1 th-text-muted">Biệt danh</label>
                    <input id="pf-nick" type="text" required value="${esc(p.nickname)}" class="w-full px-3 py-2 rounded-xl border th-border th-subtle" />
                  </div>
                </div>
                <div>
                  <label class="block mb-1 th-text-muted">Tiểu sử ngắn</label>
                  <textarea id="pf-bio" rows="2" class="w-full px-3 py-2 rounded-xl border th-border th-subtle">${esc(p.bio)}</textarea>
                </div>
                <button type="submit" class="w-full py-2 rounded-xl th-btn-primary font-semibold">Lưu hồ sơ vào trình duyệt</button>
              </form>
            </div>
          </aside>

          <section class="lg:col-span-8 space-y-5">
            <div class="grid grid-cols-3 gap-3">
              <div class="rounded-2xl border th-card p-4 text-center">
                <div class="font-mono text-xl sm:text-2xl font-bold th-blue">${totalPts}</div>
                <div class="text-[11px] th-text-muted mt-0.5">Điểm đọc 16 tuần</div>
              </div>
              <div class="rounded-2xl border th-card p-4 text-center">
                <div class="font-mono text-xl sm:text-2xl font-bold th-pink">${bookmarked.length}</div>
                <div class="text-[11px] th-text-muted mt-0.5">Truyện đánh dấu</div>
              </div>
              <div class="rounded-2xl border th-card p-4 text-center">
                <div class="font-mono text-xl sm:text-2xl font-bold th-blue">${p.downloadsCount || 0}</div>
                <div class="text-[11px] th-text-muted mt-0.5">Ebook đã tải</div>
              </div>
            </div>

            <!-- Biểu đồ đóng góp hoạt động đọc kiểu GitHub -->
            <div class="rounded-3xl border th-card p-5 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="text-sm sm:text-base font-bold">📊 Biểu đồ hoạt động đọc sách (16 tuần gần nhất)</h3>
                <div class="flex items-center gap-1 text-[10px] th-text-muted">
                  <span>Ít</span>
                  <span class="w-3 h-3 rounded-[2px]" style="background:var(--heat-0);"></span>
                  <span class="w-3 h-3 rounded-[2px]" style="background:var(--heat-1);"></span>
                  <span class="w-3 h-3 rounded-[2px]" style="background:var(--heat-2);"></span>
                  <span class="w-3 h-3 rounded-[2px]" style="background:var(--heat-3);"></span>
                  <span class="w-3 h-3 rounded-[2px]" style="background:var(--heat-4);"></span>
                  <span>Nhiều</span>
                </div>
              </div>
              <div class="overflow-x-auto pb-1">
                <div class="grid grid-flow-col grid-rows-7 gap-1.5 w-max">${cells.join("")}</div>
              </div>
            </div>

            <!-- Danh sách truyện đã đánh dấu -->
            <div class="rounded-3xl border th-card p-5 space-y-3.5">
              <h3 class="text-sm sm:text-base font-bold">💖 Kệ truyện đã đánh dấu (${bookmarked.length})</h3>
              ${
                bookmarked.length > 0
                  ? bookmarked
                      .map(
                        (s) => `
                        <div class="p-4 rounded-2xl border th-border th-subtle flex items-center justify-between gap-3">
                          <div class="min-w-0">
                            <p class="font-serif font-bold text-sm truncate">${esc(s.title)}</p>
                            <p class="text-xs th-text-muted">${esc(s.issue || "")}${s.series ? ` • ${esc(s.series)}` : ""}</p>
                          </div>
                          <div class="flex items-center gap-2 shrink-0">
                            <button type="button" onclick="app.openReader('${esc(s.id)}')" class="px-3 py-1.5 rounded-xl th-btn-primary text-xs font-semibold">Đọc tiếp</button>
                            <button type="button" onclick="app.toggleBookmark('${esc(s.id)}')" class="px-2 py-1.5 rounded-xl border th-border th-card text-xs" title="Bỏ đánh dấu">✕</button>
                          </div>
                        </div>`
                      )
                      .join("")
                  : `<p class="text-xs th-text-muted py-6 text-center">Bạn chưa đánh dấu truyện nào. Hãy nhấn nút 🤍 ở tab Tủ truyện để lưu lại nhé!</p>`
              }
            </div>
          </section>
        </div>`;
    }

    // --- TAB 5: 👑 PHÒNG CHỦ WEB (KHÓA CỨNG BẰNG FIREBASE AUTH, KHÔNG CÓ DEMO) ---

             <pre class="p-3 rounded-xl border th-border th-subtle font-mono text-[11px] overflow-x-auto leading-relaxed">${esc(FIRESTORE_RULES_SNIPPET)}</pre>
           </div>`
        : "";

      let bodyPane = "";

      if (sub === "stories") {
        const editing = state.editingStoryId ? state.firestoreStories.find((s) => s.id === state.editingStoryId) : null;
        const emptyNotice =
          state.firestoreStories.length === 0
            ? `<div class="rounded-2xl border th-border th-subtle-pink p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
                 <div class="space-y-0.5">
                   <p class="font-bold th-pink">✨ Kho truyện Firestore hiện đang trống (web đang hiển thị 3 Bài mẫu)</p>
                   <p class="th-text-sec">Bạn có thể viết kỳ truyện thật ngay bên dưới để tự động thay thế bài mẫu, hoặc đưa 3 bài mẫu lên Firestore để dùng thử chỉnh sửa.</p>
                 </div>
                 <div class="flex flex-wrap items-center gap-2 shrink-0">
                   <button type="button" onclick="app.seedSampleStories()" class="px-3 py-1.5 rounded-xl th-btn-primary font-semibold">☁️ Đưa bài mẫu lên Firestore</button>
                   <button type="button" onclick="app.toggleHideSamples()" class="px-3 py-1.5 rounded-xl border th-border th-card font-semibold">${state.hideSamplesLocally ? "Hiện lại bài mẫu" : "Ẩn bài mẫu"}</button>
                 </div>
               </div>`
            : "";

        bodyPane = `
          <div class="space-y-5">
            ${emptyNotice}
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <!-- Form Soạn / Sửa truyện -->
              <div class="lg:col-span-7 rounded-3xl border th-card p-5 sm:p-6">
                <div class="flex items-center justify-between gap-2 pb-3 mb-4 border-b th-border">
                  <h3 class="font-bold text-base sm:text-lg">${editing ? "✏️ Đang sửa kỳ truyện" : "✍️ Đăng kỳ truyện mới lên Firestore"}</h3>
                  ${editing ? `<button type="button" onclick="app.cancelEditStory()" class="px-3 py-1 rounded-xl border th-border th-subtle text-xs">Hủy sửa</button>` : ""}

                <form onsubmit="app.saveStory(event)" class="space-y-3.5 text-xs sm:text-sm">

                  <div>

                    <textarea id="st-content" rows="10" required placeholder="## Phần 1&#10;&#10;Viết nội dung truyện tại đây..." class="w-full px-3.5 py-2.5 rounded-xl border th-border th-subtle font-serif leading-relaxed">${esc(editing ? editing.content : "")}</textarea>

                  <div>

            <div class="inline-flex rounded-2xl border th-border th-subtle p-1 gap-1 text-xs font-semibold">
              <button type="button" onclick="app.setOwnerMailFilter('all')" class="px-3 py-1.5 rounded-xl ${state.ownerMailFilter === "all" ? "th-btn-primary" : "th-text-sec"}">Tất cả (${state.mailbox.length})</button>
              <button type="button" onclick="app.setOwnerMailFilter('pending')" class="px-3 py-1.5 rounded-xl ${state.ownerMailFilter === "pending" ? "th-btn-primary" : "th-text-sec"}">Chưa trả lời (${pendingMailCount})</button>
              <button type="button" onclick="app.setOwnerMailFilter('replied')" class="px-3 py-1.5 rounded-xl ${state.ownerMailFilter === "replied" ? "th-btn-primary" : "th-text-sec"}">Đã trả lời (${state.mailbox.length - pendingMailCount})</button>
            </div>

            <div class="space-y-3.5">
              ${
                list.length > 0
                  ? list
                      .map((m) => {
                        const confirmDel = state.pendingDeleteKey === `mail:${m.id}`;
                        return `
                          <div class="rounded-2xl border th-card p-4 sm:p-5 space-y-3">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                              <div class="flex flex-wrap items-center gap-2">
                                <span class="font-bold text-sm">${esc(m.senderName || "Ẩn danh")}</span>
                                <span class="font-mono px-2 py-0.5 rounded-full text-[10px] font-semibold th-subtle th-blue">${esc(m.topic || "Góp ý")}</span>
                                <span class="font-mono text-[11px] th-text-muted">${formatDateTimeVN(m.createdAt)}</span>
                              </div>
                              <button type="button" onclick="app.deleteMail('${esc(m.id)}')" class="px-2.5 py-1 rounded-xl text-[11px] font-semibold ${confirmDel ? "bg-rose-500 text-white" : "border th-border th-subtle-pink th-pink"}">
                                ${confirmDel ? "Xác nhận xóa?" : "🗑 Xóa thư rác"}
                              </button>
                            </div>
                            <p class="font-serif text-sm th-text-sec whitespace-pre-line">${esc(m.message)}</p>
                            <form onsubmit="app.sendOwnerReply(event, '${esc(m.id)}')" class="pt-2 border-t th-border flex flex-col sm:flex-row gap-2">
                              <input id="reply-input-${esc(m.id)}" type="text" required value="${esc(m.reply || "")}" placeholder="Viết câu trả lời công khai dưới huy hiệu Chủ web..." class="flex-1 px-3.5 py-2 rounded-xl border th-border th-subtle text-xs sm:text-sm" />
                              <button type="submit" class="px-4 py-2 rounded-xl th-btn-primary text-xs font-semibold shrink-0">
                                👑 ${m.reply ? "Cập nhật trả lời" : "Trả lời công khai"}
                              </button>
                            </form>
                          </div>`;
                      })
                      .join("")
                  : `<div class="rounded-2xl border th-card p-8 text-center text-sm th-text-muted">Không có lá thư nào trong mục này.</div>`
              }
            </div>
          </div>`;
      } else {
        // Khu vực (c): Cài đặt Nhạc tự động & Cấu hình web (settings/siteConfig)
        const cfg = state.siteConfig;
        bodyPane = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <form onsubmit="app.saveSiteConfig(event)" class="lg:col-span-7 rounded-3xl border th-card p-5 sm:p-6 space-y-4 text-xs sm:text-sm">
              <h3 class="font-bold text-base sm:text-lg">🎵 Cài đặt Nhạc tự động &amp; Thông tin Trang chủ</h3>

              <div class="space-y-2.5 p-4 rounded-2xl border th-border th-subtle">
                <label class="flex items-center gap-2.5 cursor-pointer font-medium">
                  <input id="cfg-music-enabled" type="checkbox" ${cfg.musicEnabled ? "checked" : ""} class="w-4 h-4 accent-pink-400" />
                  <span>🎵 Bật trình phát nhạc trên toàn trang web</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer font-medium">
                  <input id="cfg-auto-xmas" type="checkbox" ${cfg.autoPlayChristmas ? "checked" : ""} class="w-4 h-4 accent-pink-400" />
                  <span>🎄 Tự động kích hoạt nhạc dịp Giáng Sinh (23/12 – 25/12)</span>
                </label>
                <label class="flex items-center gap-2.5 cursor-pointer font-medium">
                  <input id="cfg-auto-year" type="checkbox" ${cfg.autoPlayAllYear ? "checked" : ""} class="w-4 h-4 accent-pink-400" />
                  <span>☁️ Tự động kích hoạt nhạc quanh năm cho mọi độc giả</span>
                </label>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold mb-1 th-text-sec">Giai điệu mặc định</label>
                  <select id="cfg-track" class="w-full px-3 py-2 rounded-xl border th-border th-subtle">
                    <option value="christmas" ${cfg.selectedTrack === "christmas" ? "selected" : ""}>🎄 Đêm Giáng Sinh</option>
                    <option value="spring" ${cfg.selectedTrack === "spring" ? "selected" : ""}>🌸 Mưa Xuân</option>
                    <option value="summer" ${cfg.selectedTrack === "summer" ? "selected" : ""}>☀️ Gió Biển Hạ</option>
                    <option value="autumn" ${cfg.selectedTrack === "autumn" ? "selected" : ""}>🍁 Đêm Thu</option>
                    <option value="custom-mp3" ${cfg.selectedTrack === "custom-mp3" ? "selected" : ""}>🎧 Dùng link .MP3 riêng bên dưới</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1 th-text-sec">Âm lượng mặc định (<span id="cfg-vol-label">${Math.round((cfg.volume ?? 0.45) * 100)}%</span>)</label>
                  <input id="cfg-vol" type="range" min="0.1" max="1" step="0.05" value="${cfg.volume ?? 0.45}" oninput="document.getElementById('cfg-vol-label').textContent=Math.round(this.value*100)+'%'" class="w-full accent-pink-400 mt-2 cursor-pointer" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1 th-text-sec">Link file .MP3 riêng (tùy chọn — ví dụ <code>./noel.mp3</code> tải lên kho GitHub)</label>
                <input id="cfg-mp3" type="text" value="${esc(cfg.customMp3Url || "")}" placeholder="https://... hoặc ./ten-bai-nhac.mp3" class="w-full px-3.5 py-2 rounded-xl border th-border th-subtle font-mono text-xs" />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t th-border">
                <div>
                  <label class="block text-xs font-semibold mb-1 th-text-sec">Tên Chủ bút / Chủ web</label>
                  <input id="cfg-owner-name" type="text" required value="${esc(cfg.ownerName || "Minh Anh")}" class="w-full px-3.5 py-2 rounded-xl border th-border th-subtle" />
                </div>
                <div class="flex items-end">
                  <button type="button" onclick="app.testCurrentTrackConfig()" class="w-full py-2 rounded-xl border th-border th-subtle-pink th-pink font-semibold text-xs">▶ Nghe thử bản nhạc đang chọn</button>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1 th-text-sec">Lời chào trang chủ (Hero Tagline)</label>
                <textarea id="cfg-tagline" rows="3" required class="w-full px-3.5 py-2 rounded-xl border th-border th-subtle font-serif">${esc(cfg.siteTagline)}</textarea>
              </div>

              <button type="submit" class="w-full py-2.5 rounded-xl th-btn-primary font-semibold text-sm">💾 Lưu cấu hình lên Firestore (siteConfig)</button>
            </form>

            <!-- Cột phụ: Nghe nhanh 4 giai điệu & Mã Rules bảo mật -->
            <div class="lg:col-span-5 space-y-4">
              <div class="rounded-3xl border th-card p-5 space-y-3 text-xs">
                <h4 class="font-bold text-sm">🎧 Nghe thử 4 giai điệu Web Audio có sẵn</h4>
                ${BUILTIN_TRACKS.map(
                  (t) => `
                  <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl border th-border th-subtle">
                    <div>
                      <p class="font-semibold">${esc(t.title)}</p>
                      <p class="text-[11px] th-text-muted">${esc(t.subtitle)}</p>
                    </div>
                    <button type="button" onclick="app.playSpecificTrack('${t.id}')" class="px-3 py-1 rounded-xl th-card border th-border th-blue font-semibold hover:opacity-80">▶ Nghe</button>
                  </div>`
                ).join("")}
              </div>

              <div class="rounded-3xl border th-card p-5 space-y-2.5 text-xs">
                <div class="flex items-center justify-between gap-2">
                  <h4 class="font-bold text-sm">🔒 Mã bảo mật Firestore Rules</h4>
                  <button type="button" onclick="app.copyRulesSnippet()" class="px-2.5 py-1 rounded-xl border th-border th-subtle th-blue font-semibold">📋 Copy</button>
                </div>
                <p class="th-text-muted leading-relaxed">Đảm bảo tab <strong>Rules</strong> trên Firestore đã dán đúng mã này để chỉ email <code class="font-mono">${esc(OWNER_EMAIL)}</code> mới được đăng bài &amp; trả lời thư.</p>
              </div>
            </div>
          </div>`;
      }

      return `
        <div class="space-y-5 fade-view">
          <div class="rounded-3xl border th-card p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4 neon-ring">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-2xl th-btn-primary flex items-center justify-center text-xl shadow-sm">👑</div>
              <div>
                <h2 class="font-serif text-xl sm:text-2xl font-bold">Phòng Chủ Web — Thư giãn</h2>
                <p class="font-mono text-xs th-text-muted">Đã xác thực: ${esc(state.ownerUser.email)}</p>
              </div>
            </div>
            <button type="button" onclick="app.ownerLogout()" class="px-4 py-2 rounded-xl border th-border th-subtle text-xs font-semibold hover:opacity-80">Đăng xuất</button>
          </div>

          ${rulesAlertHtml}

          <!-- 3 Khu vực quản trị rõ ràng -->
          <div class="flex flex-wrap gap-2 text-xs sm:text-sm font-semibold">
            <button type="button" onclick="app.setOwnerSubTab('stories')" class="px-4 py-2 rounded-2xl ${sub === "stories" ? "th-btn-primary" : "border th-border th-card th-text-sec"}">✍️ Viết / Sửa / Xóa Truyện</button>
            <button type="button" onclick="app.setOwnerSubTab('mailbox')" class="px-4 py-2 rounded-2xl ${sub === "mailbox" ? "th-btn-primary" : "border th-border th-card th-text-sec"}">
              📮 Duyệt &amp; Trả lời Hòm thư ${pendingMailCount > 0 ? `<span class="ml-1 font-mono px-1.5 py-0.5 rounded-full bg-white/25 text-[10px]">${pendingMailCount}</span>` : ""}
            </button>
            <button type="button" onclick="app.setOwnerSubTab('settings')" class="px-4 py-2 rounded-2xl ${sub === "settings" ? "th-btn-primary" : "border th-border th-card th-text-sec"}">🎵 Nhạc tự động &amp; Cấu hình</button>
          </div>

          ${bodyPane}
        </div>`;
    }

    function renderApp() {
      updateNavCounts();
      const main = document.getElementById("app-main");
      if (state.tab === "stories") main.innerHTML = renderStoriesTab();
      else if (state.tab === "ebooks") main.innerHTML = renderEbooksTab();
      else if (state.tab === "mailbox") main.innerHTML = renderMailboxTab();
      else if (state.tab === "profile") main.innerHTML = renderProfileTab();
      else if (state.tab === "owner") main.innerHTML = renderOwnerTab();
    }

    // =========================================================================
    // TRÌNH ĐỌC TRUYỆN TOÀN MÀN HÌNH
    // =========================================================================
    function renderReader() {
      const story = getVisibleStories().find((s) => s.id === state.readerStoryId);
      if (!story) return;

      document.getElementById("reader-top-title").textContent = story.title;
      document.getElementById("reader-top-meta").textContent = `${story.issue || "Nguyệt san"}${story.series ? ` • ${story.series}` : ""}`;
      document.getElementById("reader-series-badge").textContent = story.series || "Tác phẩm độc lập";
      document.getElementById("reader-issue-badge").textContent = story.issue || "Nguyệt san";
      document.getElementById("reader-title").textContent = story.title;
      document.getElementById("reader-meta").textContent = `${countWords(story.content)} chữ • ${(story.tags || []).join(" ")} • ${formatDateShortVN(story.updatedAt || story.createdAt)}`;

      const prose = document.getElementById("reader-body-prose");
      prose.style.fontSize = `${state.fontSize}px`;
      prose.classList.toggle("font-serif", state.readerFont === "serif");
      prose.classList.toggle("font-sans", state.readerFont === "sans");
      document.getElementById("reader-fs-label").textContent = `${state.fontSize}px`;
      document.getElementById("reader-font-btn").textContent = state.readerFont === "serif" ? "Aa Có chân" : "Aa Không chân";

      const blocks = parseStoryBlocks(story.content);
      prose.innerHTML = blocks
        .map((b) => {
          if (b.type === "h2") return `<h2>${esc(b.text)}</h2>`;
          if (b.type === "quote") return `<blockquote>“${esc(b.text)}”</blockquote>`;
          return `<p>${esc(b.text)}</p>`;
        })
        .join("");

      const noteBox = document.getElementById("reader-author-note-box");
      if (story.authorNote && story.authorNote.trim()) {
        document.getElementById("reader-author-note-text").textContent = story.authorNote.trim();
        noteBox.classList.remove("hidden");
      } else {
        noteBox.classList.add("hidden");
      }

      const saved = (state.profile.bookmarks || []).includes(story.id);
      document.getElementById("reader-bookmark-btn").textContent = saved ? "💖 Đã đánh dấu" : "🔖 Đánh dấu";

      document.getElementById("reader-scroll-container").scrollTop = 0;
      app.updateReaderProgress();
    }

    // =========================================================================
    // PUBLIC API GẮN VÀO WINDOW.APP
    // =========================================================================
    const app = {
      switchTab(tab, ownerSub = null) {
        state.tab = tab;
        if (ownerSub) state.ownerSubTab = ownerSub;
        ["stories", "ebooks", "mailbox", "profile", "owner"].forEach((t) => {
          const el = document.getElementById(`tab-${t}`);
          if (el) el.classList.toggle("active", t === tab);
        });
        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });
      },

      setTheme,
      cycleTheme,
      setSeasonOverride,

      handleSearch(val) {
        state.searchQuery = val.trim();
        document.getElementById("clear-search-btn").classList.toggle("hidden", !state.searchQuery);
        document.getElementById("search-kbd-hint").classList.toggle("hidden", Boolean(state.searchQuery));
        if (state.tab !== "stories" && state.tab !== "ebooks") this.switchTab("stories");
        else renderApp();
      },
      clearSearch() {
        const inp = document.getElementById("global-search-input");
        if (inp) inp.value = "";
        this.handleSearch("");
      },
      selectTag(t) {
        state.activeTag = t;
        renderApp();
      },
      handleEbookSearch(val) {
        state.ebookSearch = val;
        renderApp();
      },
      selectEbookTag(t) {
        state.ebookTag = t;
        renderApp();
      },
      resetEbookFilters() {
        state.ebookSearch = "";
        state.ebookTag = "#tất-cả";
        this.clearSearch();
        renderApp();
      },

      // --- Nhạc ---
      togglePlayMusic(forcePlay = false) {
        if (audioEngine.isPlaying && !forcePlay) stopMusic();
        else startMusic();
      },
      nextTrack() {
        const list = getPlaylist();
        const i = list.findIndex((t) => t.id === audioEngine.currentTrackId);
        audioEngine.currentTrackId = list[(i + 1) % list.length].id;
        if (audioEngine.isPlaying) startMusic();
        else updateMusicUI();
      },
      prevTrack() {
        const list = getPlaylist();
        const i = list.findIndex((t) => t.id === audioEngine.currentTrackId);
        audioEngine.currentTrackId = list[(i - 1 + list.length) % list.length].id;
        if (audioEngine.isPlaying) startMusic();
        else updateMusicUI();
      },
      setMusicVolume(v) {
        audioEngine.volume = parseFloat(v);
        if (audioEngine.gain) audioEngine.gain.gain.value = audioEngine.volume * 0.26;
        if (audioEngine.htmlAudio) audioEngine.htmlAudio.volume = audioEngine.volume;
      },
      toggleMusicDrawer() {
        state.musicDrawerOpen = !state.musicDrawerOpen;
        const dock = document.getElementById("music-player-dock");
        const fab = document.getElementById("music-mini-fab");
        dock.classList.toggle("hidden", !state.musicDrawerOpen);
        fab.classList.toggle("hidden", state.musicDrawerOpen);
        fab.classList.toggle("inline-flex", !state.musicDrawerOpen);
      },
      playSpecificTrack(id) {
        audioEngine.currentTrackId = id;
        startMusic();
      },
      testCurrentTrackConfig() {
        const sel = document.getElementById("cfg-track").value;
        const mp3 = document.getElementById("cfg-mp3").value.trim();
        state.siteConfig.customMp3Url = mp3;
        audioEngine.currentTrackId = sel === "custom-mp3" && mp3 ? "custom-mp3" : (sel === "custom-mp3" ? "christmas" : sel);
        startMusic();
      },
      onChristmasTreeClick() {
        const wishes = [
          "🎄 Giáng Sinh an lành! Chúc bạn đọc truyện thật ấm áp bên tách trà nóng.",
          "✨ Tuyết đang rơi nhẹ ngoài cửa sổ, để Thư giãn mở bản nhạc Đêm Giáng Sinh nhé!",
          "🔔 Mong mùa lễ hội mang đến cho bạn thật nhiều niềm vui và bình yên."
        ];
        document.getElementById("xmas-wish-bubble").innerHTML = `<span class="th-text-sec">${wishes[Math.floor(Math.random() * wishes.length)]}</span>`;
        audioEngine.currentTrackId = "christmas";
        startMusic();
      },
      hideChristmasWidget() {
        state.xmasHidden = true;
        document.getElementById("christmas-tree-widget").classList.add("hidden");
      },

      // --- Trình đọc & Tải Ebook ---
      openReader(id) {
        state.readerStoryId = id;
        renderReader();
        const modal = document.getElementById("reader-modal");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        document.getElementById("read-progress-wrap").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        recordReadingActivity(1);
      },
      closeReader() {
        const modal = document.getElementById("reader-modal");
        modal.classList.add("hidden");
        modal.classList.remove("flex");
        document.getElementById("read-progress-wrap").classList.add("hidden");
        document.body.style.overflow = "";
        if (state.tab === "stories" || state.tab === "profile") renderApp();
      },
      adjustFontSize(delta) {
        state.fontSize = Math.min(26, Math.max(14, state.fontSize + delta));
        try { localStorage.setItem("tg_fs", String(state.fontSize)); } catch {}
        document.getElementById("reader-body-prose").style.fontSize = `${state.fontSize}px`;
        document.getElementById("reader-fs-label").textContent = `${state.fontSize}px`;
      },
      toggleReaderFont() {
        state.readerFont = state.readerFont === "serif" ? "sans" : "serif";
        try { localStorage.setItem("tg_rfont", state.readerFont); } catch {}
        renderReader();
      },
      updateReaderProgress() {
        const box = document.getElementById("reader-scroll-container");
        const bar = document.getElementById("read-progress-bar");
        if (!box || !bar) return;
        const max = box.scrollHeight - box.clientHeight;
        const pct = max > 0 ? Math.min(100, Math.max(0, (box.scrollTop / max) * 100)) : 100;
        bar.style.width = `${pct}%`;
      },
      toggleBookmark(id) {
        if (!state.profile.bookmarks) state.profile.bookmarks = [];
        const i = state.profile.bookmarks.indexOf(id);
        if (i >= 0) {
          state.profile.bookmarks.splice(i, 1);
          showToast("Đã bỏ đánh dấu khỏi kệ cá nhân.");
        } else {
          state.profile.bookmarks.unshift(id);
          showToast("💖 Đã lưu kỳ truyện vào mục Cá nhân!");
        }
        saveLS("tg_reader_profile", state.profile);
        renderApp();
      },
      bookmarkCurrentStory() {
        if (!state.readerStoryId) return;
        this.toggleBookmark(state.readerStoryId);
        renderReader();
      },
      downloadEbook(id, fmt) {
        const story = getVisibleStories().find((s) => s.id === id);
        if (!story) return;
        if (fmt === "PDF") downloadStoryAsPdf(story);
        else downloadStoryAsEpub(story);
      },
      downloadCurrentStory(fmt) {
        if (state.readerStoryId) this.downloadEbook(state.readerStoryId, fmt);
      },

      // --- Hòm thư góp ý (Firestore `mailbox`) ---
      async submitMailbox(event) {
        event.preventDefault();
        if (!db) return showToast("Chưa kết nối được với Firestore.", true);
        const senderName = (document.getElementById("mb-name").value || "").trim() || "Ẩn danh";
        const topic = document.getElementById("mb-topic").value;
        const message = document.getElementById("mb-message").value.trim();
        if (!message) return;

        const btn = document.getElementById("mb-submit-btn");
        if (btn) btn.disabled = true;
        try {
          await addDoc(collection(db, "mailbox"), {
            senderName,
            topic,
            message,
            createdAt: Date.now(),
            reply: "",
            repliedAt: null
          });
          event.target.reset();
          showToast("📮 Đã gửi thư góp ý thành công! Chủ web sẽ sớm đọc nhé.");
        } catch (err) {
          handleFirestoreWriteError(err, "gửi thư góp ý");
        } finally {
          if (btn) btn.disabled = false;
        }
      },

      // --- Cá nhân (localStorage) ---
      pickAvatarEmoji(em) {
        state.profile.avatarEmoji = em;
        state.profile.avatarUrl = "";
        saveLS("tg_reader_profile", state.profile);
        renderApp();
      },
      saveProfile(event) {
        event.preventDefault();
        state.profile.displayName = document.getElementById("pf-name").value.trim() || "Độc giả Thư giãn";
        state.profile.nickname = document.getElementById("pf-nick").value.trim().replace(/^@/, "") || "docgia";
        state.profile.bio = document.getElementById("pf-bio").value.trim();
        state.profile.avatarUrl = document.getElementById("pf-url").value.trim();
        saveLS("tg_reader_profile", state.profile);
        showToast("✨ Đã lưu hồ sơ cá nhân!");
        renderApp();
      },

      // --- PHÒNG CHỦ WEB (FIREBASE AUTH THỰC TẾ) ---
      async handleOwnerLogin(event) {
        event.preventDefault();
        if (!auth) return showToast("Lỗi khởi tạo Firebase Auth.", true);
        const email = document.getElementById("owner-email").value.trim();
        const pass = document.getElementById("owner-pass").value;

        if (email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
          state.ownerLoginError = "Email này không phải tài khoản Chủ web được cấp quyền.";
          renderApp();
          return;
        }

        const btn = document.getElementById("owner-login-btn");
        if (btn) { btn.disabled = true; btn.textContent = "Đang xác thực..."; }
        state.ownerLoginError = "";

        try {
          await signInWithEmailAndPassword(auth, email, pass);
          showToast("👑 Chào mừng Chủ web quay trở lại!");
        } catch (err) {
          console.error("Login error:", err);
          const code = err && err.code ? err.code : "";
          if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
            state.ownerLoginError = "Sai email hoặc mật khẩu Firebase. Vui lòng kiểm tra lại tài khoản bạn đã tạo trong mục Authentication → Users.";
          } else if (code === "auth/too-many-requests") {
            state.ownerLoginError = "Bạn đã nhập sai quá nhiều lần. Vui lòng đợi vài phút rồi thử lại.";
          } else {
            state.ownerLoginError = `Đăng nhập thất bại: ${err.message || code}`;
          }
          renderApp();
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = "🔐 Đăng nhập Phòng Chủ Web"; }
        }
      },

      async ownerLogout() {
        if (!auth) return;
        try {
          await signOut(auth);
          state.editingStoryId = null;
          showToast("Đã đăng xuất khỏi Phòng Chủ Web.");
        } catch (err) {
          showToast("Lỗi khi đăng xuất: " + err.message, true);
        }
      },

      setOwnerSubTab(sub) {
        state.ownerSubTab = sub;
        renderApp();
      },
      setOwnerMailFilter(f) {
        state.ownerMailFilter = f;
        renderApp();
      },
      toggleHideSamples() {
        state.hideSamplesLocally = !state.hideSamplesLocally;
        renderApp();
      },
      copyRulesSnippet() {
        copyTextSafe(FIRESTORE_RULES_SNIPPET, "📋 Đã sao chép mã Rules chuẩn vào bộ nhớ tạm!");
      },

      async seedSampleStories() {
        if (!isOwnerAuthenticated() || !db) return;
        try {
          for (const s of SAMPLE_STORIES) {
            await addDoc(collection(db, "stories"), {
              title: s.title,
              series: s.series,
              issue: s.issue,
              summary: s.summary,
              tags: s.tags,
              content: s.content,
              authorNote: s.authorNote,
              createdAt: s.createdAt,
              updatedAt: Date.now()
            });
          }
          state.showRulesHelper = false;
          showToast("☁️ Đã đưa 3 bài mẫu lên Firestore! Bạn có thể chỉnh sửa hoặc xóa bất kỳ lúc nào.");
        } catch (err) {
          handleFirestoreWriteError(err, "đưa bài mẫu lên Firestore");
        }
      },

      startEditStory(id) {
        state.editingStoryId = id;
        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });
      },
      cancelEditStory() {
        state.editingStoryId = null;
        renderApp();
      },

      async saveStory(event) {
        event.preventDefault();
        if (!isOwnerAuthenticated() || !db) return;

        const title = document.getElementById("st-title").value.trim();
        const series = document.getElementById("st-series").value.trim();
        const issue = document.getElementById("st-issue").value.trim();
        const summary = document.getElementById("st-summary").value.trim();
        const content = document.getElementById("st-content").value.trim();
        const authorNote = document.getElementById("st-note").value.trim();
        const tags = document
          .getElementById("st-tags")
          .value.split(",")
          .map((t) => t.trim())
          .filter(Boolean)
          .map((t) => (t.startsWith("#") ? t : "#" + t));

        const now = Date.now();
        const editId = state.editingStoryId;

        try {
          if (editId) {
            await updateDoc(doc(db, "stories", editId), {
              title,
              series,
              issue,
              summary,
              tags: tags.length ? tags : ["#nguyệt-san"],
              content,
              authorNote,
              updatedAt: now
            });
            showToast("✅ Đã cập nhật kỳ truyện lên Firestore!");
          } else {
            await addDoc(collection(db, "stories"), {
              title,
              series,
              issue,
              summary,
              tags: tags.length ? tags : ["#nguyệt-san"],
              content,
              authorNote,
              createdAt: now,
              updatedAt: now
            });
            showToast("🚀 Đã xuất bản kỳ truyện mới cho toàn bộ độc giả!");
          }
          state.editingStoryId = null;
          state.showRulesHelper = false;
          renderApp();
        } catch (err) {
          handleFirestoreWriteError(err, "lưu truyện");
        }
      },

      async deleteStory(id) {
        if (!isOwnerAuthenticated() || !db) return;
        const key = `story:${id}`;
        if (state.pendingDeleteKey !== key) {
          state.pendingDeleteKey = key;
          clearTimeout(state.pendingDeleteTimer);
          state.pendingDeleteTimer = setTimeout(() => {
            state.pendingDeleteKey = null;
            if (state.tab === "owner") renderApp();
          }, 4000);
          renderApp();
          return;
        }
        state.pendingDeleteKey = null;
        try {
          await deleteDoc(doc(db, "stories", id));
          if (state.editingStoryId === id) state.editingStoryId = null;
          showToast("🗑 Đã xóa kỳ truyện khỏi Firestore.");
        } catch (err) {
          handleFirestoreWriteError(err, "xóa truyện");
        }
      },

      async sendOwnerReply(event, mailId) {
        event.preventDefault();
        if (!isOwnerAuthenticated() || !db) return;
        const inp = document.getElementById(`reply-input-${mailId}`);
        const reply = (inp && inp.value || "").trim();
        if (!reply) return;

        try {
          await updateDoc(doc(db, "mailbox", mailId), {
            reply,
            repliedAt: Date.now()
          });
          state.showRulesHelper = false;
          showToast("👑 Đã gửi câu trả lời công khai lên Hòm thư!");
        } catch (err) {
          handleFirestoreWriteError(err, "trả lời hòm thư");
        }
      },

      async deleteMail(mailId) {
        if (!isOwnerAuthenticated() || !db) return;
        const key = `mail:${mailId}`;
        if (state.pendingDeleteKey !== key) {
          state.pendingDeleteKey = key;
          clearTimeout(state.pendingDeleteTimer);
          state.pendingDeleteTimer = setTimeout(() => {
            state.pendingDeleteKey = null;
            if (state.tab === "owner") renderApp();
          }, 4000);
          renderApp();
          return;
        }
        state.pendingDeleteKey = null;
        try {
          await deleteDoc(doc(db, "mailbox", mailId));
          showToast("🗑 Đã xóa thư khỏi Hòm thư.");
        } catch (err) {
          handleFirestoreWriteError(err, "xóa thư");
        }
      },

      async saveSiteConfig(event) {
        event.preventDefault();
        if (!isOwnerAuthenticated() || !db) return;

        const nextCfg = {
          musicEnabled: document.getElementById("cfg-music-enabled").checked,
          autoPlayChristmas: document.getElementById("cfg-auto-xmas").checked,
          autoPlayAllYear: document.getElementById("cfg-auto-year").checked,
          selectedTrack: document.getElementById("cfg-track").value,
          customMp3Url: document.getElementById("cfg-mp3").value.trim(),
          volume: parseFloat(document.getElementById("cfg-vol").value),
          siteTagline: document.getElementById("cfg-tagline").value.trim(),
          ownerName: document.getElementById("cfg-owner-name").value.trim() || "Minh Anh"
        };

        try {
          await setDoc(doc(db, "settings", "siteConfig"), nextCfg, { merge: true });
          state.showRulesHelper = false;
          showToast("💾 Đã lưu cấu hình Nhạc & Trang chủ lên Firestore!");
        } catch (err) {
          handleFirestoreWriteError(err, "lưu cấu hình web");
        }
      }
    };

    window.app = app;

    // =========================================================================
    // KHỞI CHẠY ỨNG DỤNG & PHÍM TẮT
    // =========================================================================
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        document.getElementById("global-search-input").focus();
      } else if (e.key === "Escape") {
        app.closeReader();
      }
    });

    window.addEventListener("resize", () => {
      resizeSeasonCanvas();
      initSeasonParticles();
    });

    setTheme(state.theme, true);
    applySeasonUI();
    resizeSeasonCanvas();
    initSeasonParticles();
    animateSeasons();
    applySiteMusicConfig(false);
    renderApp();
    initRealtimeSubscriptions();
  </script>
</body>
</html>
